const ACC={red:["#d62b2b","#fff"],gold:["#e0a820","#2a0a0d"],jade:["#1f9d7a","#fff"],ink:["#3a3f6b","#fff"]};

  di:"0123456789",
  sy:"!@#$%^&*()-_=+[]{};:,.?~",

const FY={"福":"fú · blessing","禄":"lù · prosperity","寿":"shòu · longevity","喜":"xǐ · joy","龙":"lóng · dragon","凤":"fèng · phoenix","春":"chūn · spring","夏":"xià · summer","秋":"qiū · autumn","冬":"dōng · winter","山":"shān · mountain","水":"shuǐ · water","火":"huǒ · fire","木":"mù · wood","金":"jīn · gold","土":"tǔ · earth","天":"tiān · heaven","地":"dì · earth","人":"rén · people","心":"xīn · heart","云":"yún · cloud","月":"yuè · moon","星":"xīng · star","梅":"méi · plum","兰":"lán · orchid","竹":"zhú · bamboo","菊":"jú · chrysanthemum","鹤":"hè · crane","松":"sōng · pine","安":"ān · peace","康":"kāng · health","吉":"jí · auspicious","祥":"xiáng · good omen","如":"rú · as wished","意":"yì · wish","财":"cái · wealth","富":"fù · riches","平":"píng · calm","和":"hé · harmony","德":"dé · virtue","仁":"rén · kindness","义":"yì · justice","礼":"lǐ · courtesy","智":"zhì · wisdom","信":"xìn · trust","勇":"yǒng · courage","光":"guāng · light","明":"míng · bright","华":"huá · splendour"};

let S;
try{ S={...D,...JSON.parse(localStorage.getItem("fpw")||"{}")} }catch(e){ S={...D} }

const $=id=>document.getElementById(id);
const t=k=>T[S.lang][k];

const seen=new Set(), recent=[];
let cur="", busy=false, isOpen=false, last="";

function rnd(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do crypto.getRandomValues(a);while(a[0]>=lim);return a[0]%n}

  let p=["up","lo","di","sy","zh","hi"].filter(k=>S[k]).map(k=>Array.from(SETS[k]).filter(c=>!(S.sm&&"O0Il1|".includes(c)))).filter(a=>a.length);

  const p=pools(),all=p.flat(),o=[];

  const fin=unique();cur=fin.join("");

    show(fin);

function toast(msg){
  const el=$("toast");el.textContent=msg;el.classList.add("on");
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("on"),1400);
}
async function copy(txt){
  if(!txt)return;
  let ok=false;
  try{await navigator.clipboard.writeText(txt);ok=true}catch(e){}
  if(!ok&&window.AndroidBridge&&window.AndroidBridge.copy){try{window.AndroidBridge.copy(txt);ok=true}catch(e){}}
  if(!ok){
    const a=document.createElement("textarea");
    a.value=txt;a.setAttribute("readonly","");
    a.style.cssText="position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(a);a.select();
    try{ok=document.execCommand("copy")}catch(e){}
    a.remove();
  }
  const b=$("cp");
  b.textContent=ok?t("cd"):"✕";
  toast(ok?t("cd"):"✕");
  setTimeout(()=>{b.textContent=t("cp")},1200);
}

/* ---------- settings menu ---------- */
const TOG=[["up","up"],["lo","lo"],["di","di"],["sy","sy"],["zh","zh"],["hi","hi"],["sm","sm"]];
const ANI=[["aO","aO"],["aB","aB"],["aS","aS"]];
function buildMenu(){
  const m=$("menu");
  const tg=a=>a.map(([k,l])=>`<label class="row"><span style="display:block">${t(l)}</span><input type="checkbox" data-k="${k}" ${S[k]?"checked":""}></label>`).join("");
  const sl=(k,l,min,max,st,u="")=>`<div class="row v"><span>${t(l)}<b id="v_${k}">${S[k]}${u}</b></span><input type="range" data-r="${k}" min="${min}" max="${max}" step="${st}" value="${S[k]}"></div>`;
  const sg=(k,l,o)=>`<div class="row v"><span>${t(l)}</span><div class="seg" data-s="${k}">${o}</div></div>`;
  const b=(k,v,x)=>`<button data-v="${v}" class="${S[k]==v?"on":""}">${x}</button>`;
  m.innerHTML=`<h2>${t("lang")} / ${t("theme")}</h2>`+
    sg("lang","lang",b("lang","en","English")+b("lang","hi","हिन्दी")+b("lang","zh","中文"))+
    sg("theme","theme",b("theme","auto",t("auto"))+b("theme","light",t("light"))+b("theme","dark",t("dark")))+
    sg("acc","acc",Object.keys(ACC).map(k=>`<button class="c ${S.acc==k?"on":""}" data-v="${k}" style="background:${ACC[k][0]}" aria-label="${k}">${S.acc==k?"✓":""}</button>`).join(""))+
    `<h2>${t("pw")}</h2>`+sl("len","len",4,128,1)+tg(TOG)+
    `<h2>${t("an")}</h2>`+sl("shf","shf",1,1000,1)+sl("dur","dur",0.3,4,0.1)+tg(ANI)+
    `<h2>${t("hist")}</h2><button class="reset" id="rs">${t("rs")}</button>`;
}
$("menu").addEventListener("input",e=>{
  const r=e.target.dataset.r;
  if(r){S[r]=+e.target.value;$("v_"+r).textContent=S[r];apply(false);return}
  const k=e.target.dataset.k;
  if(k){S[k]=e.target.checked?1:0;apply(false)}
});
$("menu").addEventListener("click",e=>{
  const bt=e.target.closest("[data-v]");
  if(bt){S[bt.parentNode.dataset.s]=bt.dataset.v;apply(true);return}
  if(e.target.id==="rs"){
    S={...D};
    seen.clear();recent.length=0;
    try{localStorage.removeItem("fpw_hist")}catch(err){}
    cur="";
    apply(true);renderRecent();renderMean();
    $("disp").textContent=t("ph");
  }
});
function toggleMenu(f){
  const on=f??!$("menu").classList.contains("on");
  $("menu").classList.toggle("on",on);
  $("kb").setAttribute("aria-expanded",on);
}
$("kb").onclick=e=>{e.stopPropagation();toggleMenu()};
document.addEventListener("click",e=>{if(!e.target.closest("#menu")&&!e.target.closest("#kb"))toggleMenu(false)});

function apply(rebuild){
  const R=document.documentElement,ac=ACC[S.acc]||ACC.red;
  R.style.setProperty("--acc",ac[0]);R.style.setProperty("--accT",ac[1]);
  if(S.theme==="auto")R.removeAttribute("data-theme");else R.dataset.theme=S.theme;
  R.lang=S.lang==="zh"?"zh":S.lang;
  document.body.classList.toggle("nb",!S.aB);
  document.body.classList.toggle("na",!S.aO);
  $("ti").textContent=t("ti");$("su").textContent=t("su");
  $("gen").textContent=t("gen");$("cp").textContent=t("cp");
  $("kb").setAttribute("aria-label",t("set"));
  $("dk").setAttribute("aria-label",t("ti"));
  document.title=t("ti");
  if(!cur)$("disp").textContent=t("ph");
  else $("cn").textContent=S.shf+" "+t("sh");
  if(rebuild){const sc=$("menu").scrollTop;buildMenu();$("menu").scrollTop=sc}
  strength();renderMean();renderRecent();save();
}

/* ---------- macOS-style window ---------- */
function dockVec(){
  const w=$("win").getBoundingClientRect(),d=$("dk").getBoundingClientRect(),s=$("win").style;
  s.setProperty("--dx",(d.left+d.width/2-(w.left+w.width/2))+"px");
  s.setProperty("--dy",(d.top+d.height/2-(w.top+w.height/2))+"px");
}
function bounceDock(){
  const d=$("dk");d.classList.remove("bounce");void d.offsetWidth;d.classList.add("bounce");
}
function openWin(){
  if(isOpen)return;isOpen=true;
  const w=$("win");
  w.classList.remove("hide","closing");
  $("dk").classList.add("run");
  dockVec();
  w.classList.add("opening");
  setTimeout(()=>w.classList.remove("opening"),800);
}
function closeWin(){
  if(!isOpen)return;isOpen=false;toggleMenu(false);
  const w=$("win");
  dockVec();
  w.classList.remove("opening");w.classList.add("closing");
  setTimeout(()=>{
    w.classList.add("hide");w.classList.remove("closing");
    $("dk").classList.remove("run");
    bounceDock();
  },S.aO?(S.aB?550:300):0);
}
$("bc").onclick=closeWin;
$("bm").onclick=closeWin;
$("bg").onclick=()=>$("win").classList.toggle("big");
$("dk").onclick=()=>{bounceDock();if(isOpen)closeWin();else setTimeout(openWin,S.aB?350:0)};
$("gen").onclick=generate;
$("cp").onclick=()=>copy(cur);
$("disp").onclick=()=>copy(cur);
$("disp").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();copy(cur)}};
$("rc").onclick=e=>{
  e.stopPropagation();
  recent.length=0;
  try{localStorage.removeItem("fpw_hist")}catch(err){}
  renderRecent();
};
document.addEventListener("keydown",e=>{
  if(e.target.matches("input"))return;
  if(e.key==="Enter"||e.key===" "){e.preventDefault();generate()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="c"){e.preventDefault();copy(cur)}
});

/* ---------- boot ---------- */
try{
  const h=JSON.parse(localStorage.getItem("fpw_hist")||"[]");
  if(Array.isArray(h))recent.push(...h.slice(0,6));
}catch(e){}
buildMenu();
apply(false);
setTimeout(()=>{openWin();setTimeout(generate,S.aO?800:50)},200);
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
